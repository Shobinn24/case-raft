[project]
name = "caseraft-mcp"
version = "0.1.0"
description = "CaseRaft for Claude: hosted remote MCP connector bridging Claude to Clio Manage"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "cryptography>=43.0",
    "requests>=2.32",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caseraft_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
